profile_name: robomme_percmem_v1_teacher_musa
base_config: mme_vla_suite
runtime:
  cuda_visible_devices:
  - 4
  - 5
  - 6
  - 7
  xla_python_client_mem_fraction: 0.9
  xla_python_client_preallocate: true
  omp_num_threads: 8
  openblas_num_threads: 1
  openpi_data_home: /data/heping/robomme_musa/assets
  compilation_cache_dir: /data/heping/robomme_musa/jax_cpu_cache
data:
  dataset_path: /data/heping/robomme_musa/data/percmem_cache
  repo_id: robomme
  norm_assets_dir: /data/heping/robomme_musa/assets/norm/mme_vla_suite
  norm_asset_id: robomme
  expected_episodes: 1600
  expected_frames: 768897
  expected_execution_samples: 476857
weights:
  params_path: /data/heping/robomme_musa/assets/pi05_base/params
model:
  pi05: true
  dtype: bfloat16
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  action_dim: 32
  action_horizon: 20
  max_token_len: 64
  discrete_state_input: false
  use_history: true
  history_config: perceptual-learned-adarms-v1-teacher.yaml
expected_memory:
  representation_type: perceptual
  integration_type: perc_adarms
  streaming_obs_horizon: 16
  perc_mem:
    stage: teacher
    input_space: native
    feature_dim: 2560
    output_dim: 2048
    recent_frames: 4
    queue_frames: 28
    store_grid: 8
    read_grid: 4
    score_grid: 4
    max_frames: 320
    clock_hz: 20
    key_stride: 10
freeze: vision_only
learning_rate:
  schedule: warmup_then_constant
  warmup_steps: 10000
  value: 5.0e-05
optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-08
  weight_decay: 0.0
  clip_gradient_norm: 1.0
train:
  project_name: robomme-percmem-v1
  exp_name: percmem-v1-teacher-musa-s42
  seed: 42
  batch_size: 64
  num_workers: 4
  fsdp_devices: 4
  num_train_steps: 80000
  ema_decay: 0.999
  log_interval: 100
  save_interval: 10000
  keep_period: 10000
  assets_base_dir: /data/heping/robomme_musa/assets/norm
  checkpoint_base_dir: /data/heping/robomme_musa/runs/ckpts
  overwrite: false
  resume: false
  resum_ckpt_id: null
  wandb_enabled: false
evaluation:
  tasks: 16
  episodes_per_task: 50
  max_episode_steps: 1300
  execute_action_steps: 16
  last_checkpoints: 3
  seeds:
  - 7
  - 31
  - 42
musa:
  backend: mccl
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  root: /data/heping/robomme_musa
  base_export: /data/heping/robomme_musa/assets/base_export
  memory_initial: /data/heping/robomme_musa/assets/memory_initial
  jax_preprocessing: cpu
  activation_checkpointing: true
